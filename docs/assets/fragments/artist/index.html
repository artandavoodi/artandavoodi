    <div class="artist__portrait" data-portrait></div>
    <h1 id="artist-title" data-artist-name></h1>
    <p class="artist__biography" data-artist-biography></p>

  <section class="site-section artist__screen artist__latest" data-artist-latest></section>
  <div class="site-section artist__screen" data-fragment="featured"></div>
  <section class="site-section artist__screen artist__visual" data-artist-visual></section>
</section>
