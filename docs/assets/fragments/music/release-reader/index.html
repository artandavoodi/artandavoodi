<!-- ARTANDAVOODI · Music release reader; runtime fills this from release JSON. -->
<section class="music-release-reader" data-music-release-reader hidden aria-hidden="true">
  <div class="music-release-reader__panel" role="dialog" aria-modal="true" aria-label="Music release details">
    <button class="global-close-button" type="button" aria-label="Close release details" data-music-release-close>
      <span class="global-close-button__line global-close-button__line--first" aria-hidden="true"></span>
      <span class="global-close-button__line global-close-button__line--second" aria-hidden="true"></span>
    </button>
    <button class="site-back-link music-release-reader__back" type="button" aria-label="Back to release details" data-music-release-back hidden></button>
    <div class="music-release-reader__content" data-music-release-content></div>
  </div>
</section>
