name: Public browser regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: browser-target
      - uses: actions/checkout@v4
        with:
          repository: artandavoodi/artanrecords
          ref: b10b2d169b50f1ee41b6784dba32a3c476890c50
          path: browser-suite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: browser-suite
      - run: npx playwright install --with-deps chromium webkit
        working-directory: browser-suite
      - run: cp ../browser-target/tools/browser-tests/gallery.spec.mjs tools/browser-tests/gallery.spec.mjs
        working-directory: browser-suite
      - run: npx playwright test --config tools/browser-tests/playwright.config.mjs gallery.spec.mjs
        working-directory: browser-suite
        env:
          BROWSER_TARGET_ROOT: ${{ github.workspace }}/browser-target/docs
  browsers:
    uses: artandavoodi/artanrecords/.github/workflows/browser-regression.yml@b10b2d169b50f1ee41b6784dba32a3c476890c50
    with:
      site: artist
      suite_ref: b10b2d169b50f1ee41b6784dba32a3c476890c50
